spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

# permission service
spring.cloud.gateway.server.webmvc.routes[0].id=permission-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://permission-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/permissions/**

#user and role service
spring.cloud.gateway.server.webmvc.routes[1].id=user-role-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://user-role-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/users/**,/api/roles/**,/api/auth/**

#Vehicle service
spring.cloud.gateway.server.webmvc.routes[2].id=vehicle-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://vehicle-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/vehicles/**

#Customer Service
spring.cloud.gateway.server.webmvc.routes[3].id=customer
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://customer
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/customers/**
#Order-Service
spring.cloud.gateway.server.webmvc.routes[4].id=order-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://order-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/v1/orders/**
#Dealer-Service
spring.cloud.gateway.server.webmvc.routes[5].id=dealer-service
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://dealer-service
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/dealers/**
# Service Appointment
spring.cloud.gateway.server.webmvc.routes[6].id=service-appointment
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://service-appointment
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/appointments/**

jwt.secret=ThisIsADevelopmentSecretKeyThatIsAtLeast32CharactersLong123